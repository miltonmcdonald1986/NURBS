version: 2

updates:
  # Dependabot can't read FetchContent declarations; those are checked by the
  # Dependencies workflow instead.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
