name: Security

# Not run on PRs: the analysis takes several minutes and rarely finds anything
# in a single change, so it runs after merge and weekly instead.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries are run against unchanged code too.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libwayland-dev libxkbcommon-dev xorg-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # The library's templates are only instantiated by the tests, so the
      # tests are built too; otherwise most of the header code goes unanalyzed.
      # The viewer is on so that NURBS.Graphics is extracted as well.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DNURBS_BUILD_TESTS=ON
          -DNURBS_BUILD_VIEWER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          output: sarif-results
          upload: never

      # paths-ignore has no effect on C/C++ extraction, so alerts in
      # third-party code (googletest, glm, glfw, imgui under build/_deps, and
      # the vendored glad) are dropped from the SARIF here before upload.
      - name: Filter results
        shell: python
        run: |
          import glob, json

          for path in glob.glob("sarif-results/*.sarif"):
              with open(path, encoding="utf-8") as f:
                  sarif = json.load(f)
              for run in sarif["runs"]:
                  run["results"] = [
                      r for r in run.get("results", [])
                      if not any(
                          loc["physicalLocation"]["artifactLocation"]["uri"].startswith(("build/", "NURBS.Graphics/third_party/"))
                          for loc in r.get("locations", [])
                      )
                  ]
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(sarif, f)

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: /language:c-cpp
