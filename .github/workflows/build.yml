name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build: ${{ matrix.config.name }} (${{ matrix.build_type }})"
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        config:
          - name: Windows MSVC
            os: windows-latest
            c_compiler: cl
            cxx_compiler: cl
          - name: Ubuntu GCC
            os: ubuntu-24.04
            c_compiler: gcc
            cxx_compiler: g++
          - name: Ubuntu Clang
            os: ubuntu-24.04
            c_compiler: clang
            cxx_compiler: clang++
          - name: macOS AppleClang
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++

    steps:
      - uses: actions/checkout@v7

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: build-${{ matrix.config.cxx_compiler }}-${{ matrix.build_type }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.config.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx_compiler }}
          -DNURBS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: ccache statistics
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats
