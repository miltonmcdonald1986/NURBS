name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: "Coverage: gcov"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build \
            libgl-dev libwayland-dev libxkbcommon-dev xorg-dev
          pipx install gcovr==8.3

      # Debug keeps -O0 so line hits map cleanly back to source. CMake passes
      # CMAKE_CXX_FLAGS to the link step too, which pulls in libgcov.
      # The viewer is on so that NURBS.Graphics and its tests are built.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_FLAGS=--coverage
          -DNURBS_BUILD_TESTS=ON
          -DNURBS_BUILD_VIEWER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The filters keep only the libraries themselves; tests and third-party
      # code (googletest, glm, glfw, imgui under build/_deps, and the vendored
      # glad) are left out of the numbers.
      # Graphics code that only runs with a GL context or inside a live ImGui
      # frame can't run here, so it is left out too rather than counted as
      # permanently uncovered.
      # An assert's failure branch is unreachable with valid input, so assert
      # branches are dropped rather than reported as partially covered lines.
      - name: Generate report
        run: |
          mkdir -p coverage
          gcovr build \
            --root . \
            --gcov-executable gcov-13 \
            --filter 'NURBS\.Lib/' \
            --filter 'NURBS\.Graphics/' \
            --exclude 'NURBS\.Graphics/third_party/' \
            --exclude 'NURBS\.Graphics/(include/Graphics|src)/(App|GlHandle|GlUtil|MultisampleTarget|PrimitiveBatch|Scene|ShaderProgram|TriangleMesh|Viewport2D|Viewport3D|Viewport3DShaders|Widgets)\.[ch]pp$' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --exclude-branches-by-pattern '.*\bassert\(' \
            --cobertura coverage/coverage.xml \
            --html-details coverage/index.html \
            --txt coverage/summary.txt \
            --print-summary
          {
            echo '### Coverage'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/

      # Forked PRs can't see the secret; codecov-action falls back to
      # tokenless upload for those.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: true
